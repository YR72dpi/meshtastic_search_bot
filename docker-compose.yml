services:
  meshtastic-llm-bot:
    build: .
    container_name: meshtastic-llm-bot
    restart: unless-stopped
    environment:
      MESHTASTIC_HOST: "${MESHTASTIC_HOST}"
      MESHTASTIC_PORT: "${MESHTASTIC_PORT}"
      CHANNEL_INDEX: "${CHANNEL_INDEX}"
      CHANNEL_NAME: "${CHANNEL_NAME}"
      CITY: "${CITY}"
      TZ_NAME: "${TZ_NAME:-Europe/Paris}"
      RECONNECT_DELAY_SECONDS: "${RECONNECT_DELAY_SECONDS:-10}"
      SEND_DELAY_SECONDS: "${SEND_DELAY_SECONDS:-5}"
      GEORISQUES_CACHE_TTL: "${GEORISQUES_CACHE_TTL:-604800}"
      OLLAMA_URL: "${OLLAMA_URL:-http://ollama:11434/api/chat}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:1.7b}"
      OLLAMA_TIMEOUT: "${OLLAMA_TIMEOUT:-180}"
      SEARXNG_URL: "${SEARXNG_URL}"
    depends_on:
      core:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      - ollama
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:1.7b}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list; do
          echo "Attente du démarrage d'Ollama..."
          sleep 2
        done
        ollama pull "$$OLLAMA_MODEL"
        echo "Modèle $$OLLAMA_MODEL installé !"

  # the search engine
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: always
    env_file: ./.env
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - valkey-data:/data/

volumes:
  ollama_data:
  core-data:
  valkey-data: